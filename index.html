<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Internet Business | Control de clientes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="logo-internet-business.svg" alt="Internet Business - Conectando Hogares">
      <div>
        <p class="eyebrow">Administración de servicios</p>
        <h1>Control de clientes</h1>
      </div>
    </div>
    <button id="addClient" class="button">+ Agregar cliente</button>
  </header>

  <main>
    <section class="summary">
      <article class="metric total">
        <span>Total de clientes</span>
        <strong id="totalCount">0</strong>
      </article>
      <article class="metric current">
        <span>Servicio vigente</span>
        <strong id="currentCount">0</strong>
      </article>
      <article class="metric soon">
        <span>Próximos a vencer</span>
        <strong id="soonCount">0</strong>
      </article>
      <article class="metric overdue">
        <span>Vencidos</span>
        <strong id="overdueCount">0</strong>
      </article>
    </section>

    <section class="panel">
      <div class="tools">
        <label class="search" for="searchInput">
          <span>⌕</span>
          <input id="searchInput" type="search"
            placeholder="Buscar por nombre, teléfono o serial">
        </label>

        <select id="statusFilter">
          <option value="all">Todos los estados</option>
          <option value="current">Vigente</option>
          <option value="soon">Próximo a vencer</option>
          <option value="overdue">Vencido</option>
        </select>
      </div>

      <p id="resultText" class="result-text"></p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Cliente</th>
              <th>Plan</th>
              <th>Equipo / serial</th>
              <th>Instalación</th>
              <th>Fecha de corte</th>
              <th>Estado</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="clientRows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="clientDialog">
    <form id="clientForm">
      <div class="modal-header">
        <h2 id="formTitle">Agregar cliente</h2>
        <button class="close" type="button" id="closeDialog">×</button>
      </div>

      <input id="editingId" type="hidden">

      <div class="form-grid">
        <label>Nombre completo
          <input id="name" name="name" required>
        </label>

        <label>Teléfono
          <input id="phone" name="phone" required>
        </label>

        <label>Dirección
          <input id="address" name="address" required>
        </label>

        <label>Plan
          <select id="plan" name="plan" required>
            <option>30 Mbps</option>
            <option>50 Mbps</option>
            <option>100 Mbps</option>
            <option>200 Mbps</option>
            <option>300 Mbps</option>
          </select>
        </label>

        <label>Equipo
          <input id="device" name="device" required>
        </label>

        <label>Serial
          <input id="serial" name="serial" required>
        </label>

        <label>Fecha de instalación
          <input id="installation" name="installation" type="date" required>
        </label>

        <label>Fecha de corte
          <input id="cutoff" name="cutoff" type="date" required>
        </label>
      </div>

      <div class="modal-actions">
        <button class="button secondary" type="button" id="cancelDialog">
          Cancelar
        </button>
        <button class="button" type="submit">Guardar cliente</button>
      </div>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
